<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Figure lab</title>
<style>
  :root { --bg: #8fa87a; --panel: #1d211ccc; --ink: #eee9dc; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  canvas.pixel { image-rendering: pixelated; }
  #ui { position: fixed; top: 10px; left: 10px; background: var(--panel); padding: 10px 12px; border-radius: 8px; max-width: 320px; }
  #ui label { display: block; margin: 4px 0; }
  #ui select, #ui input { font: inherit; }
  #note { opacity: .75; margin-top: 6px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="ui">
  <b>Figure lab</b> — generated figures beside the current ones, on the game's skeleton and clips.
  <label>Clip <select id="clip"></select></label>
  <label>Zoom <input id="zoom" type="range" min="0.6" max="8" step="0.05" value="1.45" /> <span id="zv"></span></label>
  <label><input id="pixel" type="checkbox" checked /> Pixel art (1/3 resolution, as in the game)</label>
  <label><input id="spin" type="checkbox" /> Rotate the camera</label>
  <div id="note">Zoom 0.6–3.2 is the game's range (1.45 default); above that is a close-up.</div>
</div>
<script type="module" src="./viewer.ts"></script>
</body>
</html>
